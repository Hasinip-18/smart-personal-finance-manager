# ===================================================================
# SMART PERSONAL FINANCE MANAGER - APPLICATION PROPERTIES
# ===================================================================

# Server Configuration
server.port=8080
spring.application.name=smart-personal-finance-manager

# -------------------------------------------------------------------
# Database Configuration (MySQL)
# -------------------------------------------------------------------
# Database URL with automatic schema creation if it does not exist
spring.datasource.url=jdbc:mysql://localhost:3306/smart_finance_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Database Credentials
# You can override these using environment variables:
#   export SPRING_DATASOURCE_USERNAME=your_username
#   export SPRING_DATASOURCE_PASSWORD=your_password
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# HikariCP Connection Pool Settings
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# -------------------------------------------------------------------
# Spring Data JPA / Hibernate Configuration
# -------------------------------------------------------------------
# 'update' automatically updates table schema according to JPA entities
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Logging
logging.level.com.finance.manager=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
